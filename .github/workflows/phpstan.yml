name: quality
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer audit
      - run: composer analyse
      - run: composer lint:check
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run build
      - run: git diff --exit-code -- resources/dist/pushbox.css
