name: run-tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - os: windows-latest
            php: '8.4'
            laravel: '13.*'
            stability: prefer-stable
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }} / ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, sqlite, pdo_sqlite, bcmath, fileinfo, sodium
          coverage: none
      - name: Resolve supported dependencies
        shell: bash
        run: |
          if [[ '${{ matrix.laravel }}' == '12.*' ]]; then testbench='10.*'; else testbench='11.*'; fi
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:$testbench" --no-update --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - run: composer audit
      - run: composer test

  without-fcm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, sqlite, pdo_sqlite
          coverage: none
      - run: composer remove --dev laravel-notification-channels/fcm --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/phpunit --exclude-group fcm --exclude-group browser-fixture

  tests:
    name: tests
    if: always()
    needs: [test, without-fcm]
    runs-on: ubuntu-latest
    steps:
      - env:
          MATRIX_RESULT: ${{ needs.test.result }}
          OPTIONAL_RESULT: ${{ needs.without-fcm.result }}
        run: test "$MATRIX_RESULT" = success && test "$OPTIONAL_RESULT" = success
